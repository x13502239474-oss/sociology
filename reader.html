<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#182B27">
  <title>章节阅读 · SOCIOLOGY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="reader-page">
  <!-- 顶栏（深墨绿） -->
  <header class="topbar reader-topbar">
    <div class="topbar-inner">
      <a class="icon-btn" href="index.html" aria-label="返回首页" id="btn-home"></a>
      <a class="brand" href="index.html" style="margin-left:6px">
        <span class="wordmark">SOCIOLOGY</span>
        <span class="sub">The Science of Society</span>
      </a>
      <div class="topbar-actions">
        <button class="icon-btn" id="btn-toc" aria-label="章节目录"></button>
      </div>
    </div>
  </header>

  <!-- 正文外壳 -->
  <main class="reader-shell">
    <div class="reader-breadcrumb">
      <span class="crumb"><span class="accent" id="crumb-part"></span> · <span id="crumb-ch"></span></span>
    </div>
    <div class="reader-title-block">
      <div class="reader-kicker" id="reader-kicker"></div>
      <h1 class="reader-title" id="reader-title"></h1>
      <div class="reader-meta" id="reader-meta"></div>
    </div>

    <!-- 章节导读 -->
    <section id="intro" class="reader-body"></section>

    <!-- 正文 -->
    <div id="body" class="reader-body"></div>

    <!-- 案例 -->
    <section id="cases" class="reader-body"></section>

    <!-- 总结 -->
    <section id="summary" class="reader-body"></section>

    <!-- 思考题 -->
    <section id="thinking" class="reader-body"></section>

    <!-- 章节测试 -->
    <section id="quiz" class="quiz-section"></section>

    <!-- 标记完成 -->
    <div style="margin-top:28px">
      <button class="btn block" id="btn-done">标记本章为「已完成」</button>
    </div>
  </main>

  <!-- 底部工具栏 -->
  <nav class="reader-toolbar">
    <div class="tb-group">
      <button class="tb-btn" id="tb-prev">上一章</button>
      <button class="tb-btn" id="tb-next">下一章</button>
    </div>
    <div class="tb-group">
      <button class="tb-btn" id="tb-font" title="字体大小">Aa</button>
      <button class="tb-btn" id="tb-night" title="夜间模式"></button>
    </div>
  </nav>

  <!-- 目录抽屉 -->
  <div class="toc-drawer" id="toc-drawer">
    <div class="toc-mask" id="toc-mask"></div>
    <div class="toc-panel">
      <div class="toc-title">课程目录</div>
      <div id="toc-list"></div>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/util.js"></script>
  <script src="js/reader.js"></script>
</body>
</html>
